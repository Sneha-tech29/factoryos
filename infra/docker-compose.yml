version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: factoryos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: factoryos_user
      POSTGRES_PASSWORD: factoryos_dev_password
      POSTGRES_DB: factoryos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: factoryos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
